name: Release checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install bandit==1.8.6 detect-secrets==1.5.0
      - run: python scripts/build_release.py
      - name: Extract the shipped package
        run: unzip -q dist/*.zip -d /tmp/worklog-release
      - name: Standard Bandit checks
        run: bandit -r /tmp/worklog-release
      - name: Check shipped files for secrets
        run: |
          detect-secrets scan --all-files /tmp/worklog-release > /tmp/worklog-secrets.json
          python -c 'import json; result=json.load(open("/tmp/worklog-secrets.json")); assert not result["results"], "Review potential secrets before release"'
